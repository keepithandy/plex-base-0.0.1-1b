[project]
name = "plex-local-training"
version = "0.1.0"
description = "Local from-scratch training tools for Plex"
requires-python = ">=3.10,<3.15"
dependencies = ["torch==2.14.0", "tokenizers==0.23.2"]

[project.scripts]
plex-train = "plex_training.cli:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[dependency-groups]
dev = [
    "pytest>=8,<9",
]
